services:

  bd:
    image: postgres:14.19-alpine3.21
    env_file:
      - ./.env
    volumes:
      - ./backend/creacion_de_tablas.sql:/docker-entrypoint-initdb.d/creacion_de_tablas.sql
      - datos:/var/lib/postgresql/data
    expose:
      - "5432"
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    environment:
      TZ: America/Bogota
    env_file:
      - ./.env
    volumes:
      - ./backend/uploads/habitaciones:/app/uploads/habitaciones
    expose:
      - "8181"
    depends_on:
      - bd

  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  datos:
