server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # OBLIGATORIO PARA REACT ROUTER:
        # Intenta servir la petición como un archivo físico ($uri).
        # Si no existe, intenta servirla como directorio ($uri/).
        # Si tampoco existe, reescribe la petición a /index.html.
        try_files $uri $uri/ /index.html;
    }

    # ^~ hace que este bloque gane a las expresiones regulares de abajo: sin él,
    # las fotos (/hotel/api/uploads/...jpg) se buscarían en la carpeta del front.
    location ^~ /hotel/api/ {
        proxy_pass http://backend:8181;
        # Igual al límite de Spring (spring.servlet.multipart.max-request-size=10MB);
        # el valor por defecto de Nginx (1 MB) rechazaría la subida de fotos con 413.
        client_max_body_size 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optimización de caché para activos estáticos con Hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Página de error para fallos del servidor (502 si el backend no responde, etc.)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}