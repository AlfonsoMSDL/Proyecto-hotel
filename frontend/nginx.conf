server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # OBLIGATORIO PARA REACT ROUTER:
        # Intenta servir la petición como un archivo físico ($uri).
        # Si no existe, intenta servirla como directorio ($uri/).
        # Si tampoco existe, reescribe la petición a /index.html.
        try_files $uri $uri/ /index.html;
    }

    location /hotel/api/ {
        proxy_pass http://backend:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optimización de caché para activos estáticos con Hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirección de errores del servidor a la página principal
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}