spring.application.name=Proyecto hotel
server.port=8181
server.servlet.context-path=/hotel/api/
# ===============================
# CONFIGURACION DE LA BASE DE DATOS
# ===============================

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# ZONA HORARIA
# ===============================

spring.jackson.time-zone=America/Bogota
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ===============================
# ADMINISTRADOR INICIAL
# ===============================
# Se crea al arrancar si no existe. Sin estas variables de entorno no se crea ninguna cuenta.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

#Peso maximo para las imagenes que se pueden guardar
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
